<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administración | Nutrition Club</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap"><a href="index.html" aria-label="Nutrition Club, inicio"><img src="assets/logo-navy.png" alt="Nutrition Club"></a></div></header>
<main>
<section class="adm" id="admin">
  <div class="wrap">
    <div class="admhead">
      <div><span class="eyebrow">Administración</span><h2>Registros</h2></div>
      <a class="btn ghost" id="backlink" href="index.html">Volver al sitio</a>
    </div>
    <p class="demonote" id="demonote" hidden>Modo demo: aquí ves solo los registros hechos en este navegador. Al conectar Google Sheets (ver LEEME) verás los de todos los pacientes.</p>
    <form class="login" id="login" hidden>
      <div class="field"><label for="a-key">Clave de administración</label><input id="a-key" type="password" autocomplete="current-password"><div class="msg" id="a-err" role="alert"></div></div>
      <button class="btn" type="submit">Entrar</button>
    </form>
    <div id="panel" hidden>
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <div class="field"><label for="a-q">Buscar</label><input id="a-q" type="search" placeholder="Nombre, correo o teléfono"></div>
        <div class="field"><label for="a-est">Estado</label><select id="a-est"><option value="">Todos</option><option value="nuevo">Nuevo</option><option value="contactado">Contactado</option><option value="confirmada">Confirmada</option><option value="cancelada">Cancelada</option></select></div>
        <div class="field"><label for="a-ord">Orden</label><select id="a-ord"><option value="rec">Más recientes</option><option value="cita">Fecha de cita</option></select></div>
      </div>
      <div class="toolrow">
        <button class="btn ghost sm" type="button" id="a-refresh">Actualizar</button>
        <button class="btn ghost sm" type="button" id="a-csv">Copiar CSV</button>
        <button class="btn ghost sm" type="button" id="a-clear" hidden>Borrar datos de prueba</button>
        <span class="hint" id="a-msg" role="status"></span>
      </div>
      <div class="rechead" aria-hidden="true"><span>Paciente</span><span>Contacto</span><span>Cita</span><span>Estado</span></div>
      <div class="list" id="list"></div>
      <p class="hint" id="a-count"></p>
    </div>
  </div>
</section>
</main>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="admin.js"></script>
</body>
</html>
