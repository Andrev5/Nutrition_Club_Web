<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administración | Nutrition Club</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap"><a href="index.html" aria-label="Nutrition Club, inicio"><img src="assets/logo-navy.png" alt="Nutrition Club"></a></div></header>
<main>
<section class="adm" id="admin">
  <div class="wrap">
    <div class="admhead">
      <div><span class="eyebrow">Administración</span><h2>Panel de citas</h2></div>
      <div class="admactions">
        <button class="btn ghost sm" type="button" id="logout" hidden>Cerrar sesión</button>
        <a class="btn ghost" id="backlink" href="index.html">Volver al sitio</a>
      </div>
    </div>
    <p class="demonote" id="demonote" hidden>Modo demo: solo verás las citas hechas en este mismo navegador. Para ver las de todos los pacientes, conecta Google Sheets (ver LEEME).</p>
    <form class="login" id="login" hidden>
      <h3>Iniciar sesión</h3>
      <div class="field"><label for="a-user">Usuario</label><input id="a-user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
      <div class="field"><label for="a-pass">Contraseña</label><input id="a-pass" type="password" autocomplete="current-password"><div class="msg" id="a-err" role="alert"></div></div>
      <button class="btn" type="submit" id="a-enter">Entrar</button>
    </form>
    <div id="panel" hidden>
      <div class="stats" id="stats"></div>
      <div class="tabs" role="tablist" aria-label="Vista">
        <button type="button" role="tab" id="tab-cal" aria-selected="true" aria-controls="view-cal">Calendario</button>
        <button type="button" role="tab" id="tab-list" aria-selected="false" aria-controls="view-list">Lista</button>
      </div>
      <div id="view-cal" role="tabpanel" aria-labelledby="tab-cal">
        <div class="calwrap">
          <div class="admcal">
            <div class="calhead">
              <button class="nav" type="button" id="a-prev" aria-label="Mes anterior">&#8249;</button>
              <strong id="a-month" aria-live="polite"></strong>
              <button class="nav" type="button" id="a-next" aria-label="Mes siguiente">&#8250;</button>
            </div>
            <div class="dow" aria-hidden="true"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
            <div class="acells" id="a-cells"></div>
            <p class="hint legend"><span class="dot"></span> Día con citas. El número indica cuántas hay.</p>
          </div>
          <div class="dayview" id="dayview" aria-live="polite"></div>
        </div>
      </div>
      <div id="view-list" role="tabpanel" aria-labelledby="tab-list" hidden>
        <div class="toolbar">
          <div class="field"><label for="a-q">Buscar</label><input id="a-q" type="search" placeholder="Nombre, correo o teléfono"></div>
          <div class="field"><label for="a-mod">Modalidad</label><select id="a-mod"><option value="">Todas</option><option value="presencial">Presencial</option><option value="virtual">Virtual</option></select></div>
          <div class="field"><label for="a-est">Estado</label><select id="a-est"><option value="">Todos</option><option value="nuevo">Nuevo</option><option value="contactado">Contactado</option><option value="confirmada">Confirmada</option><option value="cancelada">Cancelada</option></select></div>
          <div class="field"><label for="a-ord">Orden</label><select id="a-ord"><option value="rec">Más recientes</option><option value="cita">Fecha de cita</option></select></div>
        </div>
        <div class="rechead" aria-hidden="true"><span>Paciente</span><span>Contacto</span><span>Cita</span><span>Estado</span></div>
        <div class="list" id="list"></div>
        <p class="hint" id="a-count"></p>
      </div>
      <div class="toolrow">
        <button class="btn ghost sm" type="button" id="a-refresh">Actualizar</button>
        <button class="btn ghost sm" type="button" id="a-csv">Copiar CSV</button>
        <button class="btn ghost sm" type="button" id="a-clear" hidden>Borrar datos de prueba</button>
        <span class="hint" id="a-msg" role="status"></span>
      </div>
    </div>
  </div>
</section>
</main>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="admin.js"></script>
</body>
</html>
